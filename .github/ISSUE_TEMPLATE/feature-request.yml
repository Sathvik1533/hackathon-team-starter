name: Feature request
description: Propose a feature or task with a clear user outcome
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Describe the expected behavior and important states.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write testable statements that tell the team when this is Done.
      placeholder: "- Given ..., when ..., then ..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: Link related Issues and call out API, design or data dependencies.
