name: Bug report
description: Report unexpected behavior that prevents or weakens the expected result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Include the affected screen, API or workflow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide short, ordered steps and example inputs.
      placeholder: "1. Open ...\n2. Submit ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots or URLs without secrets or private data.
