name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run available frontend scripts
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const { spawnSync } = require("child_process");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const scripts = pkg.scripts || {};
          for (const name of ["lint", "test", "build"]) {
            if (scripts[name]) {
              console.log(`Running npm run ${name}`);
              const result = spawnSync("npm", ["run", name], { stdio: "inherit" });
              if (result.status !== 0) process.exit(result.status || 1);
            } else {
              console.log(`Skipping npm run ${name}: script not defined`);
            }
          }
          NODE

      - name: Set up Python
        if: hashFiles('backend/requirements.txt') != '' || hashFiles('backend/pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install backend dependencies
        if: hashFiles('backend/requirements.txt') != '' || hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi

      - name: Run available backend checks
        if: hashFiles('backend/requirements.txt') != '' || hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q . ||
             [ -f pytest.ini ] || [ -f pyproject.toml ] && grep -q 'pytest' pyproject.toml; then
            python -m pip install pytest
            python -m pytest
          else
            echo "Skipping pytest: no test files or pytest configuration found"
          fi
